<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пост</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
        h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #555;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }
        textarea {
            height: 200px;
            resize: vertical;
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            padding: 10px 20px;
            border: 1px solid #007bff;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        .btn-back {
            background: white;
            color: #333;
            border-color: #ddd;
        }
        .btn-back:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Блог</h1>
        <div class="subtitle">Платформа для ведения блога</div>
        <div class="nav">
            <a href="/posts/html/">Главная</a>
            <a href="/posts/new/html">Новый пост</a>
            <a href="/docs">АПИ Документация</a>
        </div>
    </div>

    <h2>Создать новый пост</h2>

    <form action="/posts/new/html" method="post">
        <div class="form-group">
            <label for="authorId">Автор:</label>
            <select id="authorId" name="authorId" required>
                {% for user in users %}
                <option value="{{ user.id }}">user{{ user.id }} ({{ user.name }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="title">Заголовок:</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="content">Содержание:</label>
            <textarea id="content" name="content" required></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn">Создать пост</button>
            <a href="/posts/html/" class="btn btn-back">Отмена</a>
        </div>
    </form>
</body>
</html>
